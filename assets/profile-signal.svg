<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Gareth Mackenzie — From data to better decisions</title>
  <desc id="desc">An illustrative flow connects source data, validated models and decision support. Power BI, SQL and Python.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#152c3d"/></linearGradient>
    <linearGradient id="flow"><stop stop-color="#4da8ef"/><stop offset="1" stop-color="#66e3c4"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#93b4cb" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
