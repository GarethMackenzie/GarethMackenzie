    <text x="48" y="124" fill="#f4f8fc" font-size="48" font-weight="700">From data to</text>
    <text x="48" y="183" fill="#66e3c4" font-size="48" font-weight="700">better decisions.</text>
    <text x="48" y="230" fill="#b6c9d9" font-size="21">Analytics. Engineering. Business insight.</text>
