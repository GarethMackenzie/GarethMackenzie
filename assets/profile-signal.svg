<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 130" role="img" aria-labelledby="title desc">
  <title id="title">Welcome to Gareth Mackenzie's portfolio</title>
  <desc id="desc">Minimal professional analytics portfolio header.</desc>

  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#238636" stop-opacity="0"/>
      <stop offset="32%" stop-color="#3fb950" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7ee787"/>
      <stop offset="68%" stop-color="#3fb950" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-150%" width="220%" height="400%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="130" rx="9" fill="#0d1117"/>

  <g
    font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
    font-size="8"
    fill="#3fb950"
    opacity="0.12">

    <text x="70" y="18">0 1 1 0 1</text>
    <text x="245" y="25">1 0 1 0</text>
    <text x="408" y="15">0 1 0 1 1</text>
    <text x="608" y="23">1 1 0 1</text>
    <text x="786" y="17">0 1 1 0 0</text>
  </g>

  <text
    x="480"
    y="45"
    text-anchor="middle"
    font-family="Segoe UI,Arial,sans-serif"
    font-size="24"
    font-weight="700"
    letter-spacing="3.4"
    fill="#f0f6fc">
    WELCOME TO MY PORTFOLIO
  </text>

  <text
    x="480"
    y="66"
    text-anchor="middle"
    font-family="Segoe UI,Arial,sans-serif"
    font-size="10"
    font-weight="500"
    letter-spacing="1.5"
    fill="#8b949e">
    ANALYTICS • BUSINESS INTELLIGENCE • DECISION SYSTEMS
  </text>

  <line
    x1="150"
    y1="84"
    x2="810"
    y2="84"
    stroke="#30363d"
    stroke-width="1"/>

  <path
    d="M150 103
       C210 103 236 102 278 102
       S334 103 370 94
       S414 86 449 93
       S492 110 532 101
       S578 87 620 94
       S680 104 724 99
       S774 96 810 93"
    fill="none"
    stroke="#30363d"
    stroke-width="2"/>

  <path
    d="M150 103
       C210 103 236 102 278 102
       S334 103 370 94
       S414 86 449 93
       S492 110 532 101
       S578 87 620 94
       S680 104 724 99
       S774 96 810 93"
    fill="none"
    stroke="url(#signal)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-dasharray="110 550"
    filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="660" to="-660" dur="7.5s" repeatCount="indefinite"/>
  </path>

  <circle cx="449" cy="93" r="2.8" fill="#7ee787" filter="url(#glow)"/>
  <circle cx="620" cy="94" r="2.4" fill="#56d364" opacity="0.7"/>
</svg>
